apiVersion: apps/v1
kind: Deployment
metadata:
  name: gallery-app
  namespace: gallery
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gallery-app
  template:
    metadata:
      labels:
        app: gallery-app
    spec:
      containers:
        - name: gallery-app
          image: cr.yandex/crpr25sbblpv56rolatt/gallery-app:v1.0.1@sha256:b484c67a10b7dca069cb5d8b28ec026af3f5b49e8952f55e5b8fd3a33dc24fcb
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gallery-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
